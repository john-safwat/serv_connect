# Local development: points at the compose.yaml Postgres/Redis with clearly fake local credentials.
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/serveconnect}
spring.datasource.username=${DATABASE_USERNAME:serveconnect}
spring.datasource.password=${DATABASE_PASSWORD:local-dev-only}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

serveconnect.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
