# Production: structure only. Every value comes from the environment; secrets have no defaults,
# so a missing variable aborts startup.
spring.docker.compose.enabled=false
server.forward-headers-strategy=framework

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

serveconnect.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Redis over TLS by default; override with REDIS_SSL_ENABLED=false only for a private non-TLS network.
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

# Re-bound and validated (RequiredSecretsProperties) so a set-but-empty variable aborts startup.
serveconnect.required.database-url=${DATABASE_URL}
serveconnect.required.database-username=${DATABASE_USERNAME}
serveconnect.required.database-password=${DATABASE_PASSWORD}
serveconnect.required.redis-host=${REDIS_HOST}
serveconnect.required.redis-password=${REDIS_PASSWORD}
