# Local development only. Credentials are intentionally fake and must never protect real data.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: serveconnect
      POSTGRES_USER: serveconnect
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serveconnect -d serveconnect"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7  # no password locally: the compose service connection does not carry one
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
